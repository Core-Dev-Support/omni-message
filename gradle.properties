## Project-wide Gradle settings.
#
# Этот файл ОТСЛЕЖИВАЕТСЯ в git и содержит ТОЛЬКО несекретные настройки.
# Пароли от keystore сюда НЕ кладутся — они читаются из (в порядке приоритета):
#   1. -P флаги в командной строке (используется в CI)
#   2. local.properties   (локальная разработка, в gitignore)
#   3. secrets.properties (локальная разработка, в gitignore)
#   4. переменные окружения
#
## Версия приложения
APP_VERSION_CODE=7105
APP_VERSION_NAME=12.10.5
APP_PACKAGE=com.naua_omni_message.app
IS_PRIVATE=false

## Gradle / JVM
org.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1g
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.configureondemand=false
org.gradle.tooling.parallel=true

## Android
android.useAndroidX=true
android.enableJetifier=true
android.defaults.buildfeatures.buildconfig=true
android.enableR8.fullMode=true
android.r8.optimizedResourceShrinking=true
android.enableResourceOptimizations=true

# Значения по умолчанию для подписи. Реальные пароли переопределяются
# из local.properties / secrets.properties / env / -P (см. build.gradle, loadSecret).
RELEASE_KEY_PASSWORD=android
RELEASE_KEY_ALIAS=androidkey
RELEASE_STORE_PASSWORD=android
