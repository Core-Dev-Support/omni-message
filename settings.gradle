include ':TMessagesProj'
include ':TMessagesProj_App'
include ':TMessagesProj_AppHuawei'
// TMessagesProj_AppHockeyApp отключён: троттлинг/краш-репорты выпиливаются
// по плану (G1 — ноль телеметрии). Модуль требует google-services.json
// с HockeyApp SDK и не собирается в CI.
// Включать обратно: include ':TMessagesProj_AppHockeyApp'
include ':TMessagesProj_AppStandalone'
include ':TMessagesProj_AppTests'
include ':jlatexmath'
project(':jlatexmath').projectDir = file('TMessagesProj/lib/jlatexmath/jlatexmath')

dependencyResolutionManagement {
    repositories {
        google()
        mavenCentral()
    }
}

// Gradle Build Cache: кеширует РЕЗУЛЬТАТ компиляции (javac, R8, ресурсы),
// а не только скачанные зависимости.
//
// Зачем: TMessagesProj — это ~5000 Java-файлов, и холодный javac занимает
// ~22 минуты из ~33 минут сборки. Раньше кешировались только библиотеки,
// поэтому каждый запуск в CI компилировал всё заново. С этим кешем Gradle
// пропускает задачи, входы которых не изменились — при правке одного файла
// компилируется только он.
//
// Каталог переживает прогоны за счёт actions/cache в .github/workflows/build.yml
// (шаг "Cache Gradle build outputs"). Локально тоже полезен: повторная
// сборка на ноутбуке становится минутной.
buildCache {
    local {
        directory = new File(rootDir, ".gradle-build-cache")
        // ВНИМАНИЕ: у DirectoryBuildCache нет свойства maxSize — оно есть
        // только у файлового кеша ~/.gradle/caches/build-cache-1. Попытка
        // задать maxSize здесь роняет конфигурацию:
        // "Could not set unknown property 'maxSize'".
        // Размер каталога поэтому не ограничен настройкой — за этим следит
        // removeUnusedEntriesAfterDays и вытеснение кешей в GitHub Actions.
        removeUnusedEntriesAfterDays = 14
    }
}

gradle.ext.androidxMediaModulePrefix = 'TMessagesProj_Modules:media3:media-'
apply from: file("TMessagesProj_Modules/media/core_settings.gradle")