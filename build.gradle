// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    repositories {
        mavenCentral()
        google()
        maven { url 'https://developer.huawei.com/repo/' }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2'
        classpath 'com.google.gms:google-services:4.3.15'
        classpath 'com.huawei.agconnect:agcp:1.9.1.301'
        classpath 'com.google.firebase:firebase-crashlytics-gradle:2.9.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.0"
    }
}
repositories {
    google()
}

// Strip JLatexMath fonts we don't ship (transitive AAR assets from
// io.noties.markwon:ext-latex -> ru.noties:jlatexmath-android, ~764 KB total under
// assets/org/scilab/forge/jlatexmath/fonts/). Has to live in the APK modules — a
// library's androidResources.ignoreAssetsPattern doesn't filter packaging in apps
// that consume it. Using subprojects keeps it in one place.
//   keep:  base/, latin/, maths/, euler/  (\mathbb, \mathcal, \mathfrak still work)
//   drop:  latin/optional/, maths/optional/  (~290 KB; \textbf/\textit/\mathds fall back)
//          licences/                          (~20 KB; pure license text files)
// Секреты подписи живут не в git. Приоритет:
//   1. -P<NAME>=...        (командная строка; используется в CI)
//   2. local.properties    (локальная разработка, в gitignore)
//   3. secrets.properties  (локальная разработка, в gitignore)
//   4. переменные окружения
//   5. gradle.properties   (только несекретные дефолты)
// В git-репозитории секретов нет — CI получает их из GitHub Secrets.
def secretProps = new Properties()
['local.properties', 'secrets.properties'].each { name ->
    def f = rootProject.file(name)
    if (f.exists()) {
        secretProps.load(new FileInputStream(f))
    }
}
ext.loadSecret = { String name ->
    // 1. -P<NAME>=... из командной строки (CI)
    def cli = gradle.startParameter.projectProperties[name]
    if (cli) {
        return cli.toString()
    }
    // 2/3. local.properties, secrets.properties
    if (secretProps.getProperty(name)) {
        return secretProps.getProperty(name).toString()
    }
    // 4. переменные окружения
    def env = System.getenv(name)
    if (env) {
        return env
    }
    // 5. дефолт из gradle.properties (только несекретные заглушки)
    if (project.hasProperty(name)) {
        return project.property(name).toString()
    }
    return ''
}
['RELEASE_STORE_PASSWORD', 'RELEASE_KEY_PASSWORD', 'RELEASE_KEY_ALIAS'].each { name ->
    def v = loadSecret(name)
    if (v) {
        ext.set(name, v)
    }
}

// Плагин google-services падает, если в google-services.json нет клиента
// с package_name == applicationId. Своего Firebase-проекта у нас пока нет
// (см. PLAN.md B4/G1 — FCM и телеметрия выпиливаются), а апстримовские JSON
// содержат только org.telegram.messenger. Поэтому подключаем плагин только
// когда рядом лежит свой google-services.json с нашим пакетом.
// Поменял APP_PACKAGE -> положил свой JSON -> плагин включился автоматически.
ext.applyGoogleServices = { org.gradle.api.Project proj ->
    def f = new File(proj.projectDir, 'google-services.json')
    if (!f.exists()) {
        return false
    }
    def base = rootProject.hasProperty('APP_PACKAGE') ? rootProject.property('APP_PACKAGE') : ''
    if (!base) {
        return false
    }
    return f.text.contains(base)
}

subprojects {
    plugins.withId('com.android.application') {
        android {
            androidResources {
                ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~:!optional:!licences:!*stmary*:!*eufb*'
            }
        }
    }

    if (project.projectDir.absolutePath.contains('/TMessagesProj_Modules/media/')) {
        project.plugins.withId('com.android.library') {
            project.android {
                if (namespace == null) {
                    def manifestFile = file("${project.projectDir}/src/main/AndroidManifest.xml")

                    if (manifestFile.exists()) {
                        def manifest = new XmlSlurper().parse(manifestFile)
                        def manifestPackage = manifest.@package.text()

                        if (manifestPackage) {
                            namespace manifestPackage
                        }
                    }
                }
            }
        }
    }
}