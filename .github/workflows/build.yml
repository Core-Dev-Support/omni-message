name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Gradle build type (release / debug)'
        required: false
        default: 'release'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Отменяем прогон только для pull_request: там берётся последний коммит.
  # Для push в main отменять НЕЛЬЗЯ — сборка идёт до часа, и правка документации
  # или комментария в коде убивала её на середине, не сохранив кеш нативных
  # объектов (см. инцидент с прогоном 36814531097).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx8g

jobs:
  build:
    name: Assemble APK
    runs-on: ubuntu-latest
    # Максимум для GitHub-hosted раннеров — 360 минут.
    # Нативная сборка 2 ABI с нуля занимает ~1.5 ч, плюс R8/упаковка.
    timeout-minutes: 355

    steps:
      # Checkout делаем сами, а не через submodules: recursive. Полные клоны
      # сабмодулей (ffmpeg, webrtc-стек, boringssl, media3) весят ~7.3 ГБ, а на
      # раннере только ~14 ГБ. С --depth 1 становится ~2.5 ГБ.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1
          persist-credentials: true

      - name: Init submodules (shallow)
        run: |
          set -euo pipefail
          git config --global core.longpaths true
          git submodule update --init --recursive --depth 1 --jobs 4 \
            || git submodule update --init --recursive --jobs 4
          echo "checkout size:"; du -sh . 2>/dev/null | tail -1

      # На ubuntu-latest предустановлено ~10 ГБ мусора, который нам не нужен:
      # Haskell (ghc/ghcup), .NET, Swift, Boost. Удаляем ДО сборки, иначе
      # нативная часть + упаковка не помещаются ("No space left on device").
      # Java из /opt/hostedtoolcache НЕ трогаем — он нужен.
      - name: Free runner disk space
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/.ghcup /opt/ghc \
                      /usr/local/share/boost /usr/share/swift \
                      /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo rm -rf /usr/local/lib/android/sdk/ndk/* 2>/dev/null || true
          echo "after cleanup:"; df -h / | tail -1

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # ВНИМАНИЕ: android-actions/setup-android@v3 ставит пакет "tools", который
      # убран из репозитория Google ("Failed to find package 'tools'"). Ставим
      # cmdline-tools вручную нужной версии.
      - name: Set up Android SDK
        run: |
          set -euo pipefail
          SDK_ROOT="$ANDROID_SDK_ROOT"
          CMDLINE_VERSION=11076708   # 12.0
          curl -fsSL -o /tmp/cmdline.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-${CMDLINE_VERSION}_latest.zip"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          unzip -q /tmp/cmdline.zip -d /tmp/cmdline
          rm -rf "$SDK_ROOT/cmdline-tools/latest"
          mv /tmp/cmdline/cmdline-tools "$SDK_ROOT/cmdline-tools/latest"
          echo "SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Install SDK packages
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.22.1" \
            "ndk;27.2.12479018"

      # Ключ зависит ТОЛЬКО от CMake-конфигурации нативной части.
      # Сюда намеренно НЕ включён TMessagesProj/build.gradle: любая правка
      # Gradle-файла (buildConfigField, версия, флаг) сбрасывала бы весь
      # нативный кеш и добавляла ~25 мин к каждой сборке. Проверено:
      # добавление api_id в buildConfigField стоило лишних 8 минут.
      # api_id / api_hash Telegram. В коде их нет (репозиторий публичный),
      # а build.gradle читает их из local.properties через loadSecret.
      # Если секретов нет — подставятся дефолты апстрима (APP_ID=4):
      # APK соберётся и запустится, но вход в аккаунт не пройдёт.
      - name: Write Telegram credentials
        env:
          API_ID: ${{ secrets.OMNI_TELEGRAM_API_ID }}
          API_HASH: ${{ secrets.OMNI_TELEGRAM_API_HASH }}
        run: |
          set -euo pipefail
          if [ -n "$API_ID" ] && [ -n "$API_HASH" ]; then
            {
              echo "OMNI_TELEGRAM_API_ID=$API_ID"
              echo "OMNI_TELEGRAM_API_HASH=$API_HASH"
            } >> local.properties
            echo "::notice::api_id injected from secrets"
          else
            echo "::warning::No OMNI_TELEGRAM_API_ID/HASH secrets - building with upstream defaults (APP_ID=4). Login will not work."
          fi

      - name: Cache native build objects
        uses: actions/cache@v4
        with:
          path: |
            **/.cxx
          key: cxx-${{ runner.os }}-${{ inputs.build_type || 'release' }}-${{ hashFiles('TMessagesProj/jni/CMakeLists.txt') }}
          restore-keys: |
            cxx-${{ runner.os }}-${{ inputs.build_type || 'release' }}-
            cxx-${{ runner.os }}-

      # Кеш РЕЗУЛЬТАТА компиляции (включён в settings.gradle через buildCache).
      # Это то, что реально ускоряет сборку: javac в TMessagesProj — ~5000
      # файлов и ~22 минуты холодной компиляции. Раньше кешировались только
      # скачанные библиотеки, поэтому каждый прогон компилировал всё заново.
      - name: Cache Gradle build outputs
        uses: actions/cache@v4
        with:
          path: .gradle-build-cache
          # Ключ по run_id: содержимое кеша меняется почти каждый прогон,
          # поэтому стабильный ключ не подошёл бы — actions/cache не
          # перезаписывает существующую запись, и кеш «замёрз» бы.
          # restore-keys подхватывает предыдущий прогон, Gradle дописывает
          # изменившееся. Старые записи GitHub вытесняет по LRU.
          key: gbc-${{ runner.os }}-${{ inputs.build_type || 'release' }}-${{ github.run_id }}
          restore-keys: |
            gbc-${{ runner.os }}-${{ inputs.build_type || 'release' }}-
            gbc-${{ runner.os }}-

      # Шаг нормализации timestamps УДАЛЁН как бесполезный: проверен на прогоне
      # #9 (56m36s) — объекты в кеше были (6903 шт), но CMake всё равно
      # пересобрал всё. Причина была не в mtime, а в лишних ABI.
      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.OMNI_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          mkdir -p TMessagesProj/config
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > TMessagesProj/config/release.keystore
            echo "SIGNING_ARGS=-PRELEASE_STORE_PASSWORD=$STORE_PASSWORD -PRELEASE_KEY_PASSWORD=$KEY_PASSWORD -PRELEASE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "::notice::Using production signing key from secrets"
          else
            keytool -genkeypair -v \
              -keystore TMessagesProj/config/release.keystore \
              -alias androidkey -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Omni Message Dev, OU=Dev, O=Omni Message, L=NA, S=NA, C=NA"
            echo "::warning::No OMNI_KEYSTORE_BASE64 secret - built with throwaway dev key. Not distributable."
          fi

      # ВАЖНО: шага «удалить .o файлы» здесь быть НЕ должно.
      # Удаление объектов CMake инвалидирует задачи buildCMake*, и следующий
      # assembleAfatRelease запускает полную нативную пересборку с нуля
      # (~1.5 ч), из-за чего прогон упирался в timeout. Место освобождаем
      # чисткой мусора раннера и shallow-сабмодулями выше.

      - name: Build APK
        run: |
          chmod +x gradlew
          TYPE="${{ inputs.build_type || 'release' }}"
          echo "Build type: $TYPE"
          df -h / | tail -1
          # shellcheck disable=SC2086
          ./gradlew --parallel --stacktrace $SIGNING_ARGS \
            ":TMessagesProj_App:assembleAfat${TYPE^}"
          echo "=== disk after build ==="
          df -h / | tail -1
          find TMessagesProj_App/build/outputs -name "*.apk" -exec ls -lh {} \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: omni-message-apk
          path: |
            TMessagesProj_App/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
