name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Gradle build type (release / debug)'
        required: false
        default: 'release'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx8g

jobs:
  build:
    name: Assemble APK
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
          persist-credentials: true

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # ВНИМАНИЕ: android-actions/setup-android@v3 ставит пакет "tools", который
      # убран из репозитория Google ("Failed to find package 'tools'"). Ставим
      # cmdline-tools вручную нужной версии.
      - name: Set up Android SDK
        run: |
          set -euo pipefail
          SDK_ROOT="$ANDROID_SDK_ROOT"
          CMDLINE_VERSION=11076708   # 12.0
          curl -fsSL -o /tmp/cmdline.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-${CMDLINE_VERSION}_latest.zip"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          unzip -q /tmp/cmdline.zip -d /tmp/cmdline
          rm -rf "$SDK_ROOT/cmdline-tools/latest"
          mv /tmp/cmdline/cmdline-tools "$SDK_ROOT/cmdline-tools/latest"
          echo "SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Install SDK packages
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.22.1" \
            "ndk;27.2.12479018"

      - name: Cache native build objects
        uses: actions/cache@v4
        with:
          path: |
            **/.cxx
            TMessagesProj/jni/**/CMakeFiles
          key: cxx-${{ runner.os }}-${{ hashFiles('TMessagesProj/jni/CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            cxx-${{ runner.os }}-${{ hashFiles('TMessagesProj/jni/CMakeLists.txt') }}-
            cxx-${{ runner.os }}-

      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.OMNI_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          mkdir -p TMessagesProj/config
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > TMessagesProj/config/release.keystore
            echo "SIGNING_ARGS=-PRELEASE_STORE_PASSWORD=$STORE_PASSWORD -PRELEASE_KEY_PASSWORD=$KEY_PASSWORD -PRELEASE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "::notice::Using production signing key from secrets"
          else
            keytool -genkeypair -v \
              -keystore TMessagesProj/config/release.keystore \
              -alias androidkey -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Omni Message Dev, OU=Dev, O=Omni Message, L=NA, S=NA, C=NA"
            echo "::warning::No OMNI_KEYSTORE_BASE64 secret - built with throwaway dev key. Not distributable."
          fi

      - name: Report disk usage
        run: df -h / /home/runner 2>/dev/null || true

      # Раннер ubuntu-latest даёт ~14 ГБ, а нативная сборка 2 ABI съедает почти
      # всё: 1732 .o + .so по ~330 МБ. Без чистки упаковка падает с
      # "No space left on device" (видели на прогоне #4).
      # Стратегия: ждём готовности .so, удаляем объекты CMake, потом держим
      # Gradle в режиме без сборки лишнего. Повторный запуск не пересобирает
      # нативное — оно up-to-date.
      - name: Build native libraries
        run: |
          chmod +x gradlew
          TYPE="${{ inputs.build_type || 'release' }}"
          # Важно: у release не buildCMakeRelease, а buildCMakeRelWithDebInfo.
          case "$TYPE" in
            release) VARIANT=RelWithDebInfo ;;
            debug)   VARIANT=Debug ;;
            *) echo "Unknown build type: $TYPE"; exit 1 ;;
          esac
          echo "TYPE=$TYPE" >> "$GITHUB_ENV"
          echo "Building native: $VARIANT"
          # shellcheck disable=SC2086
          ./gradlew --parallel --stacktrace $SIGNING_ARGS \
            ":TMessagesProj:buildCMake${VARIANT}[armeabi-v7a][tmessages.49]" \
            ":TMessagesProj:buildCMake${VARIANT}[arm64-v8a][tmessages.49]"

      - name: Free disk space (drop CMake objects)
        run: |
          echo "=== before ==="
          df -h / | tail -1
          du -sh TMessagesProj/.cxx 2>/dev/null || true
          find TMessagesProj/.cxx -name "*.o" -delete 2>/dev/null || true
          find TMessagesProj -path "*CMakeFiles*" -name "*.o" -delete 2>/dev/null || true
          echo "=== after ==="
          df -h / | tail -1
          du -sh TMessagesProj/.cxx 2>/dev/null || true

      - name: Assemble APK
        run: |
          # shellcheck disable=SC2086
          ./gradlew --parallel --stacktrace $SIGNING_ARGS \
            ":TMessagesProj_App:assembleAfat${TYPE^}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: omni-message-apk
          path: |
            TMessagesProj_App/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
